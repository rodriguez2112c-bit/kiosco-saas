[build]
  command = "pnpm install --no-frozen-lockfile --prefer-offline && pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.12.3"
  CI = "false"

[[redirects]]
  from = "/api/*"
  to = "https://kiosco-saas.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200